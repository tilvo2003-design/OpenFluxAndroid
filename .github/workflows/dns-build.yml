name: Build with DNS through the tunnel

# Builds OpenFluxAndroid from this fork's main branch with two changes: the
# phone's DNS goes through the tunnel to a home resolver (default
# 192.168.1.1), instead of being answered from the phone by the mobile
# network's resolver; and the core keeps its Avito rooms connected and brings
# them up in lanes (.github/patches), with 90 s instead of 30 s to connect. The APKs are signed with the keystore in the
# repository secrets ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD
# (alias "openflux") and attached to the run as an artifact.
on:
  workflow_dispatch:
    inputs:
      dns:
        description: 'DNS server through the tunnel'
        default: '192.168.1.1'
        required: true
      version:
        description: 'Version shown in the app (X.Y.Z)'
        default: '3.14.6'
        required: true

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive

      - name: Patch the Avito fixes into the core
        run: |
          python3 .github/patches/avito_keepalive.py OpenFlux/transport/avito/avito.go
          python3 .github/patches/avito_pairs.py OpenFlux/transport/avito/avito.go
          python3 .github/patches/avito_op_limit.py OpenFlux/transport/avito/avito.go
          python3 .github/patches/avito_room_spent.py OpenFlux/transport/avito/avito.go
          python3 .github/patches/avito_gate_refund.py OpenFlux/transport/avito
          python3 .github/patches/session_handshake_timeout.py OpenFlux/transport/session.go
          python3 .github/patches/telemost_full_slots.py OpenFlux/transport/yandex/telemost.go

      - name: Wait longer for a slow carrier
        # 30 s is too little for a document carrier, which Avito lets in
        # one room per 12 s; 90 s.
        run: |
          f=androidApp/src/main/kotlin/io/openflux/android/core/AndroidConnectionService.kt
          grep -q 'CONNECT_TIMEOUT_MS = 30_000L' "$f" || { echo "::error::CONNECT_TIMEOUT_MS changed upstream"; exit 1; }
          sed -i 's/CONNECT_TIMEOUT_MS = 30_000L/CONNECT_TIMEOUT_MS = 90_000L/' "$f"

      - name: Patch DNS through the tunnel
        env:
          DNS: ${{ inputs.dns }}
        run: |
          [[ "$DNS" =~ ^[0-9]{1,3}(\.[0-9]{1,3}){3}$ ]] || { echo "::error::DNS '$DNS' is not an IPv4 address"; exit 1; }
          svc=androidApp/src/main/kotlin/io/openflux/android/core/AndroidConnectionService.kt
          tun=androidApp/src/main/kotlin/io/openflux/android/core/PacketTunnel.kt
          python3 - "$svc" "$tun" "$DNS" <<'EOF'
          import sys
          svc, tun, dns = sys.argv[1:]
          def patch(path, old, new):
              t = open(path, encoding="utf-8").read()
              if t.count(old) != 1:
                  sys.exit(f"{path}: expected exactly one '{old.strip()}', found {t.count(old)}; the upstream code changed")
              open(path, "w", encoding="utf-8").write(t.replace(old, new))
          # The VPN's DNS server: the home resolver instead of the mobile network's.
          patch(svc, "val dns = networkDns()", f'val dns = "{dns}" // patched: DNS through the tunnel')
          # Queries are no longer answered from the phone: they go through the tunnel as UDP.
          patch(tun, " " * 20 + "isIpv4UdpDns(packet) -> runCatching { dnsWorkers.execute { forwardDns(packet) } }\n", "")
          patch(tun, "isIpv4Tcp(packet) || isIpv4Udp(packet) -> {",
                "isIpv4Tcp(packet) || isIpv4Udp(packet) || isIpv4UdpDns(packet) -> {")
          print("patched")
          EOF
          git diff

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: OpenFlux/go.mod
          cache-dependency-path: OpenFlux/go.sum

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Add Android SDK tools to PATH
        run: echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973"

      - name: Test the Avito carrier
        working-directory: OpenFlux
        run: go test ./transport/avito/...

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20260908204917-8b95e45f8d3e
          go install golang.org/x/mobile/cmd/gobind@v0.0.0-20260908204917-8b95e45f8d3e

      - name: Build the core (gomobile)
        run: bash scripts/build-android-core.sh

      - name: Restore keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          [ -n "$ANDROID_KEYSTORE_BASE64" ] || { echo "::error::secret ANDROID_KEYSTORE_BASE64 is not set"; exit 1; }
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d ' \r\n' | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Build APKs
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: openflux
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: ./gradlew --no-daemon -PappVersion=${{ inputs.version }} :androidApp:assembleRelease

      - name: Verify signatures
        run: |
          find androidApp/build/outputs/apk/release -name '*.apk' -print0 | \
            xargs -0 -r -n1 "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs | grep -E 'SHA-256|Verif' | sort -u

      - name: Collect
        run: |
          mkdir -p dist
          find androidApp/build/outputs/apk/release -name '*.apk' -exec cp {} dist/ \;
          for apk in dist/*.apk; do mv "$apk" "dist/OpenFluxAndroid-${{ inputs.version }}-dns-$(basename "$apk")"; done
          cd dist && sha256sum *.apk > SHA256SUMS.txt && cat SHA256SUMS.txt

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: OpenFluxAndroid-${{ inputs.version }}-dns
          path: dist/*
          if-no-files-found: error
