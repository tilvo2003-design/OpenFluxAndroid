name: Build the OpenFlux core with the Avito keepalive

# Builds the exit-node core (p1neappleXpress/OpenFlux) with two Avito fixes
# from .github/patches: the keepalive (Avito closes a room's connection after a
# quiet minute, so the unpatched core reconnects every room each minute and
# never keeps its lanes up) and the lane order (rooms come up as send/receive
# pairs, so the first handshakes give whole lanes), plus the handshake turn
# given back by a room that stopped waiting and a 60 s client handshake. The binaries and their
# SHA-256 sums are published as a release of this repository, where OpenFlux
# Panel downloads the core from.
on:
  workflow_dispatch:
    inputs:
      core_ref:
        description: 'p1neappleXpress/OpenFlux tag or commit'
        default: 'v0.17.1'
        required: true
      tag:
        description: 'Release tag in this repository'
        default: 'core-v0.17.1-ka11'
        required: true

permissions:
  contents: write

jobs:
  core:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: p1neappleXpress/OpenFlux
          ref: ${{ inputs.core_ref }}
          path: core
          fetch-depth: 0

      - name: Patch the Avito keepalive and lane order
        run: |
          python3 .github/patches/avito_keepalive.py core/transport/avito/avito.go
          python3 .github/patches/avito_pairs.py core/transport/avito/avito.go
          python3 .github/patches/avito_op_limit.py core/transport/avito/avito.go
          python3 .github/patches/avito_room_spent.py core/transport/avito/avito.go
          python3 .github/patches/avito_rooms_up.py core/transport/avito/avito.go
          python3 .github/patches/avito_join_new.py core/transport/avito/avito.go
          python3 .github/patches/avito_gate_refund.py core/transport/avito
          python3 .github/patches/avito_rotate.py core/transport/avito
          python3 .github/patches/session_handshake_timeout.py core/transport/session.go
          python3 .github/patches/session_exit_quiet.py core/transport
          python3 .github/patches/carrier_health.py core
          python3 .github/patches/rooms_progress.py core
          python3 .github/patches/cups_shared_session.py core/transport/cupsonline
          python3 .github/patches/android_anet.py core
          git -C core diff

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum

      - name: Test the patched carriers and the Session
        working-directory: core
        run: go test ./transport/ ./transport/avito/... ./transport/cupsonline/...

      - name: Build
        working-directory: core
        env:
          CORE_REF: ${{ inputs.core_ref }}
        run: |
          mkdir -p ../dist
          ver="${CORE_REF}-keepalive"
          ldflags="-s -w -X main.Version=$ver -X main.BuildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ) -X main.CommitHash=$(git rev-parse --short HEAD)"
          # android/arm64 for a node in Termux: a linux build there cannot list the
          # network interfaces (Android denies the netlink dump), and WebRTC
          # (Telemost) fails with "netlinkrib: permission denied"; the android
          # build goes through wlynxg/anet, which works within Android's rules.
          for t in android/arm64 linux/arm64 linux/amd64 linux/arm windows/amd64; do
            os=${t%/*}; arch=${t#*/}
            out="../dist/openflux-$os-$arch"; [ "$os" = windows ] && out="$out.exe"
            # wlynxg/anet reaches into net with a //go:linkname that Go's linker
            # refuses since 1.23 unless told otherwise (as the upstream
            # build_android.sh does).
            extra=""; [ "$os" = android ] && extra="-checklinkname=0"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags "$extra $ldflags" -o "$out" .
          done
          cd ../dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: openflux-core-${{ inputs.tag }}
          path: dist/*
          if-no-files-found: error

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          CORE_REF: ${{ inputs.core_ref }}
        run: |
          notes="OpenFlux core $CORE_REF (p1neappleXpress/OpenFlux) with Avito fixes (.github/patches): a WebSocket ping every 20 s, so Avito does not close idle rooms after a minute (avito_keepalive.py), rooms started as send/receive pairs, so a side can hear its peer from the first handshakes (avito_pairs.py), the handshake turn of a room that stopped waiting given back (avito_gate_refund.py), Avito's per-room operation limit waited out on the same connection (avito_op_limit.py), a room whose data budget is spent left alone (avito_room_spent.py), the number of rooms connected on the normal log for OpenFlux Panel (avito_rooms_up.py), new rooms joined right away (avito_join_new.py), a spent room's lane given new rooms through a control room, with the same link (avito_rotate.py), room creation on the normal log (rooms_progress.py), cups.online rooms entered as the session that created them, carried in the list (cups_shared_session.py), a carrier that delivers little passed over while another is healthy (carrier_health.py), a 60 s client handshake (session_handshake_timeout.py), no keepalives from an exit whose client is gone (session_exit_quiet.py), and the android build told it runs on Android 11+ so WebRTC can list the network interfaces (android_anet.py)."
          gh release view "$TAG" >/dev/null 2>&1 && gh release delete "$TAG" --yes --cleanup-tag
          gh release create "$TAG" dist/* --title "OpenFlux core $CORE_REF + Avito fixes ($TAG)" --notes "$notes" --target "$GITHUB_SHA"
